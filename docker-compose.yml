services:
  backend:
    build: ./be
    ports:
      - "3002:3002"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=ravi
      - DB_PASS=r@viRAVI1999
      - DB=markethub

  frontend:
    build: ./fe/markethub
    ports:
      - "3000:3000"
    depends_on:
      - backend

  mysql:
    image: mysql:8
    restart: always
    ports:
      - "3005:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=r@viRAVI1999
      - MYSQL_DATABASE=markethub
      - MYSQL_USER=ravi
      - MYSQL_PASSWORD=r@viRAVI1999
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uravi", "-pr@viRAVI1999"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
